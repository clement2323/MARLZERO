[package]
name = "morris_tablebase"
version = "0.1.0"
edition = "2021"
description = "Retrograde tablebase for Nine Men's Morris (Gasser 1996 reproduction)"
license = "MIT"

[lib]
name = "morris_tablebase"
path = "src/lib.rs"

[dependencies]
indicatif = "0.17"
memmap2 = "0.9"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
