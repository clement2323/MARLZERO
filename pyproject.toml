[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morris-rl"
version = "0.1.0"
description = "AlphaZero-style RL agent for Nine Men's Morris"
requires-python = ">=3.11"
dependencies = [
    # Pinned to 2.5.1 + cu124 wheel: newer torch (2.7+) links against NCCL 2.27,
    # whose ncclCommWindowDeregister symbol is missing on this machine's NCCL.
    "torch==2.5.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "loguru>=0.7",
    "tensorboard>=2.16",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "lightzero==0.2.0",
    "cmake>=4.3.2",
    "pybind11>=3.0.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# torch.nn.functional as F is universal PyTorch convention
"src/morris_rl/network/*.py" = ["N812"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
