# First simple AlphaZero self-play training in FLYING variant.
# Games run until the Gévay tablebase covers the current movement
# position (≥ ply terminate_at_ply, hands empty, not must_capture). The
# normalized first_key at that moment serves as the terminal value
# target for every sample in the game. PURE Gévay — no hybrid fallback:
# games that don't hit Gévay by ply gevay.max_total_plies are dropped.
#
# Usage (assumes Phase 2 V_Gévay files are saved at GEVAY_DIR):
#   GEVAY_DIR=$(pwd)/data/tablebase/gevay python scripts/train.py \
#       --config-name rl_gevay_flying_400sims

defaults:
  - default
  - _self_

# GraphNet backbone (11 planes: 7 legacy + 4 structural).
# ~300 k params; tested fast on the target RTX 4070.
network:
  type: graphnet
  num_blocks: 4
  num_channels: 128
  policy_head_hidden: 64
  value_head_hidden: 64

input_encoding:
  num_planes: 11

# 400 MCTS sims per ply per the user's spec.
mcts:
  num_simulations_train: 400

self_play:
  num_workers: 8
  # Minimum ply count before we START polling Gévay for coverage. Below
  # this ply hands aren't empty so Gévay never covers — polling earlier
  # is pure subprocess overhead.
  terminate_at_ply: 18
  # Activates the Flying variant (3-piece fly rule) in the rules engine
  # used by self-play. Has no observable effect during placement (fly only
  # kicks in at 3 pieces in movement phase, which we never reach during
  # placement), but it matches the variant the Gévay tablebase was
  # computed for so the value signal lines up semantically.
  variant: flying

# V_Gévay reward configuration. When `dir` resolves to a directory with
# valid `gevay_flying_w{w}_b{b}_wp0_bp0.bin` files, each self-play worker
# spawns its own `play_tb --serve --gevay-dir` subprocess. Every ply ≥
# terminate_at_ply checks if Gévay covers the current position; on the
# first hit the game stops and the normalized first_key becomes the value
# target. If the game reaches `max_total_plies` without ever seeing a
# hit, OR terminates naturally (someone <3 pieces, blocked, etc) without
# a hit, the WHOLE game is dropped from the buffer.
gevay:
  enabled: true
  dir: ${oc.env:GEVAY_DIR,${oc.env:HOME}/projets/MARL/data/tablebase/gevay}
  phase1_dir: ${oc.env:TABLEBASE_DIR,${oc.env:HOME}/projets/MARL/data/tablebase/flying}
  # Hard upper bound on game length when Gévay polling is active. Any
  # game that reaches this ply count without ever seeing a Gévay hit is
  # DROPPED — no samples added to the buffer. There is no hybrid value
  # fallback by design: the training signal must be pure Gévay.
  max_total_plies: 60
