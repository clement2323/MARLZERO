# Base configuration for Nine Men's Morris RL training.
# All values are overridable via Hydra command-line overrides.
# e.g.:  python scripts/train.py mcts.num_simulations_train=400

seed: 42
run_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}

algorithm: alphazero

network:
  # type ∈ {"resnet", "graphnet"}.
  #   resnet   — legacy Conv1d trunk, works for both Morris and Reversi.
  #   graphnet — Morris-only heterogeneous MPN that exploits the board's
  #              adjacency + mill matrices natively. Uses 11 input planes
  #              (7 legacy + 4 structural: threats, degree, ring).
  type: resnet
  # 16x208 (~4.1M params): bumped from 16x192 to take advantage of the
  # 7+ GB of free VRAM in shared_gpu mode after Tier 2.1 (CUDA-graphed
  # forward at FP16 leaves plenty of headroom). Width-over-depth bump
  # because shared_gpu favours larger conv ops on small batches.
  # With per_worker_cpu the CPU forwards become the bottleneck — drop
  # back to 12x128 if you ever want to revert.
  # For type=graphnet a good default is num_blocks=4, num_channels=128
  # (~300 k params, comparable expressivity to the 165 k ResNet 6×64
  # baseline plus graph-aware inductive bias).
  num_blocks: 16
  num_channels: 208
  policy_head_hidden: 64
  value_head_hidden: 64
  # "scalar" = tanh + MSE (default). "categorical" = 3-logit cross-entropy
  # (KataGo-style). Categorical avoids lazy-mean collapse in draw-heavy games.
  # Incompatible across types: a checkpoint trained with one cannot load the other.
  value_head_type: scalar
  # LoRA (Low-Rank Adaptation) for two-phase fine-tuning (placement → movement).
  # Workflow: train trunk on placement, checkpoint, then:
  #   python scripts/train.py network.lora_rank=8 training.resume=<ckpt>
  # lora_rank=0 disables LoRA entirely. Set lora_rank>0 alongside
  # freeze_trunk=true to train only the low-rank adapters.
  lora_rank: 0        # 0 = disabled. Set to 8 for two-phase fine-tuning.
  lora_alpha: 16.0    # Scaling factor: scale = lora_alpha / lora_rank.
  freeze_trunk: false # Set true with lora_rank>0 to freeze base weights.
  # Weights-only init from a supervised warmup checkpoint (Phase 3 transition).
  # Unlike training.resume, this does NOT load the optimizer or step counter —
  # the trainer starts fresh on top of the pre-trained network.
  init_from: null     # e.g. outputs/sup_warmup_5k/best.pt

input_encoding:
  num_planes: 7
  # Plane 0: current player's pieces
  # Plane 1: opponent's pieces
  # Plane 2: pieces in current player's hand (scalar broadcast, divided by 9)
  # Plane 3: pieces in opponent's hand
  # Planes 4-5: phase one-hot (placing, moving) — no FLYING in this variant
  # Plane 6: must-capture flag (set after forming a mill)

# Auxiliary heads (KataGo-style multi-task learning).
# The trunk gains two extra regression heads predicting dense, noise-free
# targets derived from the current state. Their gradients shape the shared
# representation alongside the noisy end-of-game value target, accelerating
# learning and avoiding value-head collapse caused by ambiguous outcomes.
# Reference: Wu (2019), "Accelerating Self-Play Learning in Go".
aux_heads:
  enabled: true
  hidden_size: 64
  # λ weights on top of the base (policy + value) loss. KataGo uses ~0.15;
  # too high distorts the main objective, too low has no effect.
  mill_diff_weight: 0.15      # MSE on (own_mills - opp_mills), current-player view
  pieces_diff_weight: 0.15    # MSE on (own_pieces - opp_pieces), current-player view

mcts:
  num_simulations_train: 150
  num_simulations_eval: 800
  num_simulations_demo: 5000
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

self_play:
  # 16 workers in shared_gpu mode: workers spend ~80% of cycle waiting on the
  # GPU reply, so CPU usage stays light (~3-4 cores busy out of 16). Going
  # higher than ~24 hits diminishing returns as forward time scales with batch.
  num_workers: 10
  # per_worker_cpu : each worker runs torch on CPU in-process. Simple, no IPC,
  #                  but does not exploit GPU during MCTS leaf evaluation.
  # shared_gpu     : centralized GPU inference server batches leaf evaluations
  #                  across workers. Big throughput win on small networks.
  inference_mode: shared_gpu
  inference_device: cuda      # "cuda" or "cpu" (only used in shared_gpu mode)
  max_batch_size: 64          # GPU forward batch upper bound (≥ num_workers)
  max_wait_ms: 10             # batcher max latency budget per request — bumped
                              # from 5 once the forward went FP16+CUDA-streamed
                              # (per-leaf is cheaper, can wait a bit longer to
                              # coalesce a larger batch)
  inference_batch_size: 32    # legacy/unused, kept for backward compat
  # Worker recycling — prevents accumulated RSS (suspected ctree leak in early
  # training) from triggering an OOM. Worker exits cleanly on either trigger;
  # the manager's watcher thread respawns it. Set 0 to disable a trigger.
  worker_max_rss_mb: 1500     # exit if worker RSS exceeds this many MB
  worker_recycle_games: 0   # exit after producing this many games
  # Resign threshold (KataGo-style) — abandon hopeless games early. Disabled
  # by default; the trainer logs verify-fraction stats so you can calibrate
  # the threshold post-hoc (resign/verified_correct_rate target ≥ 0.95).
  resign:
    enabled: false
    threshold: -0.90              # network's root-value below this counts as "low"
    min_consecutive_below: 3      # filter MCTS noise: N plies in a row required
    min_move_for_resign: 30       # never resign during placement (too noisy)
    verify_fraction: 0.05         # play out 5% of would-resign games for calibration
  # Playout cap randomization (KataGo-style). When enabled, each ply tosses
  # Bernoulli(full_sim_fraction): "full" plies use mcts.num_simulations_train
  # and contribute samples to the buffer; "fast" plies use fast_sim_count and
  # are NOT stored (visit distribution too noisy to train on). Increases
  # games-per-hour at constant policy-target quality.
  playout_cap:
    enabled: false
    full_sim_fraction: 0.25       # ~25% of moves are "full" (recorded)
    fast_sim_count: 60            # sim count for the other 75% (not recorded)
  # Curriculum (random late-game starts). With prob random_start_fraction
  # per game, self-play starts from a randomly drawn position with
  # pieces_per_player pieces per side and empty hands — biases the data
  # toward decisive endgames so the value head sees more clear signals.
  # No external winning-side label is injected; the network plays the
  # game from this start as usual.
  curriculum:
    # Enabled by default: 30% of games start from a 5v5 random mid-game
    # position, which dramatically shortens self-play (~20-30 moves instead
    # of 100-200) and feeds the buffer with decisive endgame outcomes —
    # giving the value head clean win/loss signals at every step, instead
    # of the noisy tiebreak it would get from many full-length games.
    enabled: true
    random_start_fraction: 0.3
    pieces_per_player: 5
  # Phase 3 — Asymmetric self-play (3 regimes per game to break the draw
  # attractor). One player is the "high" side (high temperature or high
  # Dirichlet noise), the other the "low" side. Side assignment is randomized
  # per game so neither P1 nor P2 carries the explorer role systematically.
  asymmetric:
    enabled: false               # opt in; default keeps standard symmetric play
    prob_sym: 0.5                # share of games with standard schedule
    prob_t_asym: 0.3             # share with temperature asymmetric
    prob_noise_asym: 0.2         # share with Dirichlet asymmetric
    high_temp_value: 1.0
    low_temp_value: 0.0
    high_noise_alpha: 1.0        # Dirichlet α for the high-noise side
    high_noise_epsilon: 0.5      # mix fraction for the high-noise side
  # Discard halfmove-cap games from the replay buffer entirely. Their value=0
  # targets on non-draw positions reinforce the draw attractor. Enabled = fewer
  # samples but cleaner signal; the curriculum compensates with more decisive games.
  discard_timeout_games: false
  temperature_schedule:
    moves_0_to_10: 1.0
    moves_10_plus: 0.0
  tree_reuse: false  # disabled during training; enabled in eval/demo

training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  replay_buffer_size: 200000
  min_buffer_size: 2000          # wait for this many samples before first gradient step
  total_steps: 500000            # total gradient updates (stop condition)
  updates_per_collected_game: 4
  lr_decay_steps: 200000         # cosine annealing period (steps)
  checkpoint_interval: 1000      # save a .pt file every N gradient steps
  symmetry_augmentation: true    # 8x augmentation via dihedral group
  mixed_precision: true          # FP16 via torch.cuda.amp
  resume: null                   # path to a .pt checkpoint to resume from, or null
  # Phase 3 — LR warmup over the first N steps (linear ramp from lr*0.01 to lr)
  # then cosine decay over the remaining lr_decay_steps - lr_warmup_steps. Set
  # to 0 (default) for backward compatibility — bare cosine decay as before.
  lr_warmup_steps: 0
  # Phase 3 — Sub-buffer of minimax-warmup positions to mix into every minibatch.
  # Disabled by default; opt in by setting warmup_data_path to a directory
  # containing worker_*.jsonl files (output of scripts/generate_warmup_dataset.py).
  warmup_data_path: null
  warmup_buffer_size: 200000     # capacity in positions (post-augmentation)
  warmup_mix_fraction: 0.3       # share of each minibatch from the warmup buffer
  warmup_mix_anneal_steps: 0     # >0 = linear decay of the fraction to 0 over N steps
  warmup_gamma: 1.0              # discount γ^(T-t) applied to value target when loading
  warmup_policy_temperature: 1.0 # softmax(scores / τ) on root_scores for policy targets
  # Phase 3 — Periodic eval vs minimax baselines (logs to TB under eval/*).
  eval_vs_baselines:
    enabled: false               # off by default; opt in for Phase 3 runs
    interval: 5000               # every N gradient steps
    n_games_d3: 50               # games vs MinimaxAgent(depth=3)
    n_games_d5: 50               # games vs MinimaxAgent(depth=5)
    num_sims: 200                # MCTS sims for the NetworkAgent candidate
    include_bare_argmax: true    # also eval the bare prior (no MCTS) vs d3

device: auto  # "auto" = cuda if available, else cpu

mlflow:
  # File-based tracking by default — the trainer writes runs to ./mlruns
  # without needing a server process running, which would otherwise spawn
  # ~9 subprocesses and consume 1.5-2 GB of RAM (we OOM'd once at 6 workers).
  # To view the UI, run:  uv run mlflow ui --backend-store-uri file:./mlruns
  # To use a remote server instead, set tracking_uri to its http URL.
  enabled: false
  tracking_uri: file:./mlruns
  experiment_name: morris-az
  run_name: null  # null → use the Hydra run_dir name (e.g. "20-13-15")

promotion:
  mode: arena  # 'arena' or 'continuous'
  eval_games: 100
  win_rate_threshold: 0.55
