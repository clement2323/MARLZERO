# Base configuration for Nine Men's Morris RL training.
# All values are overridable via Hydra command-line overrides.
# e.g.:  python scripts/train.py mcts.num_simulations_train=400

seed: 42
run_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}

algorithm: alphazero

network:
  type: resnet
  # 16x192 (~3M params): tuned for shared_gpu mode where the GPU can absorb
  # larger forwards cheaply. With per_worker_cpu the CPU forwards become the
  # bottleneck — drop back to 12x128 if you ever want to revert.
  num_blocks: 16
  num_channels: 192
  policy_head_hidden: 64
  value_head_hidden: 64

input_encoding:
  num_planes: 8
  # Plane 0: current player's pieces
  # Plane 1: opponent's pieces
  # Plane 2: pieces in current player's hand (scalar broadcast, divided by 9)
  # Plane 3: pieces in opponent's hand
  # Planes 4-6: phase one-hot (placing, moving, flying)
  # Plane 7: must-capture flag (set after forming a mill)

mcts:
  num_simulations_train: 150
  num_simulations_eval: 800
  num_simulations_demo: 5000
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

self_play:
  # 16 workers in shared_gpu mode: workers spend ~80% of cycle waiting on the
  # GPU reply, so CPU usage stays light (~3-4 cores busy out of 16). Going
  # higher than ~24 hits diminishing returns as forward time scales with batch.
  num_workers: 10
  # per_worker_cpu : each worker runs torch on CPU in-process. Simple, no IPC,
  #                  but does not exploit GPU during MCTS leaf evaluation.
  # shared_gpu     : centralized GPU inference server batches leaf evaluations
  #                  across workers. Big throughput win on small networks.
  inference_mode: shared_gpu
  inference_device: cuda      # "cuda" or "cpu" (only used in shared_gpu mode)
  max_batch_size: 64          # GPU forward batch upper bound (≥ num_workers)
  max_wait_ms: 10             # batcher max latency budget per request — bumped
                              # from 5 once the forward went FP16+CUDA-streamed
                              # (per-leaf is cheaper, can wait a bit longer to
                              # coalesce a larger batch)
  inference_batch_size: 32    # legacy/unused, kept for backward compat
  # Worker recycling — prevents accumulated RSS (suspected ctree leak in early
  # training) from triggering an OOM. Worker exits cleanly on either trigger;
  # the manager's watcher thread respawns it. Set 0 to disable a trigger.
  worker_max_rss_mb: 1500     # exit if worker RSS exceeds this many MB
  worker_recycle_games: 0   # exit after producing this many games
  temperature_schedule:
    moves_0_to_10: 1.0
    moves_10_plus: 0.0
  tree_reuse: false  # disabled during training; enabled in eval/demo

training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  replay_buffer_size: 200000
  min_buffer_size: 2000          # wait for this many samples before first gradient step
  total_steps: 500000            # total gradient updates (stop condition)
  updates_per_collected_game: 4
  lr_decay_steps: 200000         # cosine annealing period (steps)
  checkpoint_interval: 1000      # save a .pt file every N gradient steps
  symmetry_augmentation: true    # 8x augmentation via dihedral group
  mixed_precision: true          # FP16 via torch.cuda.amp
  resume: null                   # path to a .pt checkpoint to resume from, or null

device: auto  # "auto" = cuda if available, else cpu

mlflow:
  # File-based tracking by default — the trainer writes runs to ./mlruns
  # without needing a server process running, which would otherwise spawn
  # ~9 subprocesses and consume 1.5-2 GB of RAM (we OOM'd once at 6 workers).
  # To view the UI, run:  uv run mlflow ui --backend-store-uri file:./mlruns
  # To use a remote server instead, set tracking_uri to its http URL.
  enabled: false
  tracking_uri: file:./mlruns
  experiment_name: morris-az
  run_name: null  # null → use the Hydra run_dir name (e.g. "20-13-15")

promotion:
  mode: arena  # 'arena' or 'continuous'
  eval_games: 100
  win_rate_threshold: 0.55
