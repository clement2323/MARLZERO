seed: 42
run_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
algorithm: alphazero
network:
  type: resnet
  num_blocks: 10
  num_channels: 128
  policy_head_hidden: 64
  value_head_hidden: 64
input_encoding:
  num_planes: 8
mcts:
  num_simulations_train: 200
  num_simulations_eval: 800
  num_simulations_demo: 5000
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
self_play:
  num_workers: 12
  inference_batch_size: 32
  temperature_schedule:
    moves_0_to_10: 1.0
    moves_10_plus: 0.0
  tree_reuse: false
training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  replay_buffer_size: 500000
  min_buffer_size: 2000
  total_steps: 3000
  updates_per_collected_game: 4
  lr_decay_steps: 200000
  checkpoint_interval: 1000
  symmetry_augmentation: true
  mixed_precision: true
device: auto
promotion:
  mode: arena
  eval_games: 100
  win_rate_threshold: 0.55
